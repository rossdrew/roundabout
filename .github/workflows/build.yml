name: Build

# Tests, javadoc, the demo and mutation tests on every PR and every push to main
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Skia's native dependencies
        run: sudo apt-get update -q && sudo apt-get install -yq libegl1
      - name: Test, javadoc and demo
        run: ./gradlew test javadoc compileDemoJava

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Skia's native dependencies
        run: sudo apt-get update -q && sudo apt-get install -yq libegl1
      - name: Mutation tests
        run: ./gradlew pitestBadge
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: build/reports/pitest
      - name: Prepare Pages site
        if: github.event_name == 'push'
        run: |
          mkdir -p public/pitest
          cp build/reports/pitest-badge/pitest.json public/pitest.json
          cp -r build/reports/pitest/* public/pitest/
      - name: Upload Pages site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  # main only: the mutation badge (pitest.json) and report at https://rossdrew.github.io/roundabout/
  pages:
    if: github.event_name == 'push'
    needs: mutation
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
