name: Build

# Tests, javadoc and the demo on every PR and every push to main
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, javadoc and demo
        run: ./gradlew test javadoc compileDemoJava
