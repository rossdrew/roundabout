name: Build

# Tests, javadoc, the demo and mutation tests (failing below the threshold in build.gradle.kts) on every PR and every push to main
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Skia's native dependencies
        run: sudo apt-get update -q && sudo apt-get install -yq libegl1
      - name: Test, javadoc and demo
        run: ./gradlew test javadoc compileDemoJava

  # main also publishes the badge (badges branch) and report (gh-pages, served by Pages at
  # https://rossdrew.github.io/roundabout/pitest/)
  mutation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Skia's native dependencies
        run: sudo apt-get update -q && sudo apt-get install -yq libegl1
      - name: Mutation tests
        run: ./gradlew pitest
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: build/reports/pitest
      - name: Badge
        uses: rossdrew/PitestCI@v1
        with:
          reports: build/reports/pitest/mutations.xml
          report: true
