name: Publish

# Publishing a GitHub release (tag vX.Y.Z) builds, tests and publishes that version to GitHub Packages
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Skia's native dependencies
        run: sudo apt-get update -q && sudo apt-get install -yq libegl1
      - name: Check the tag matches the build version
        run: |
          version=$(./gradlew -q properties | sed -n 's/^version: //p')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match version $version"; exit 1; }
      - name: Test and publish
        run: ./gradlew test publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
